version: '3.8'

services:
  # PostgreSQL database for business data
  postgres:
    image: postgres:17-alpine
    container_name: mcp-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-business_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcp-network

  # Business MCP Server - PostgreSQL analyzer
  business-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-business-db
    command: python business_mcp.py
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-business_db}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-business_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DEBUG: ${DEBUG:-false}
      PYTHONUNBUFFERED: 1
    ports:
      - "${BUSINESS_MCP_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - mcp-network

  # Memory MCP Server - Context memory manager
  memory-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-context-memory
    command: python memory_mcp.py
    environment:
      MEMORY_DB_PATH: /app/data/memory.db
      DEBUG: ${DEBUG:-false}
      PYTHONUNBUFFERED: 1
    ports:
      - "${MEMORY_MCP_PORT:-8002}:8002"
    volumes:
      - .:/app
      - memory_data:/app/data
    networks:
      - mcp-network

volumes:
  postgres_data:
    driver: local
  memory_data:
    driver: local

networks:
  mcp-network:
    driver: bridge
